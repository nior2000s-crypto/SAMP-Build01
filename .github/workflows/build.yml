name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        else
          echo "No zip file found, skipping unzip."
        fi

    - name: Link C++ Header Directories
      run: |
        # ค้นหาตำแหน่งโฟลเดอร์ samp_widgets ที่แท้จริง
        WIDGETS_DIR=$(find . -type d -name "samp_widgets" | head -n 1)
        if [ -n "$WIDGETS_DIR" ]; then
          echo "Found samp_widgets at: $WIDGETS_DIR"
          
          # เชื่อมโยงไปยังจุดต่างๆ ที่ C++ อาจเรียกหา
          mkdir -p app/src/main/cpp/samp_widgets
          mkdir -p app/src/main/cpp/samp/samp_widgets
          mkdir -p app/src/main/cpp/samp/gui/samp_widgets
          
          cp -r $WIDGETS_DIR/* app/src/main/cpp/samp_widgets/ 2>/dev/null || true
          cp -r $WIDGETS_DIR/* app/src/main/cpp/samp/samp_widgets/ 2>/dev/null || true
          cp -r $WIDGETS_DIR/* app/src/main/cpp/samp/gui/samp_widgets/ 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
