name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Fix Duplicate Vectors & Correct Include Strategy
      run: |
        CPP_ROOT="app/src/main/cpp"

        # 1. แก้ปัญหา Opus Config & Version
        find "$CPP_ROOT" -type d -iname "*opus*" | while read -r opus_dir; do
          echo '#define PACKAGE_VERSION "1.3.1"' > "$opus_dir/version.h"
          echo '#define VERSION "1.3.1"' >> "$opus_dir/version.h"
          echo '#define VAR_ARRAYS 1' >> "$opus_dir/version.h"
          echo '#define CUSTOM_MODES 1' >> "$opus_dir/version.h"
        done

        # 2. แก้ปัญหา Redefinition ใน common.h
        find "$CPP_ROOT" -iname "common.h" | while read -r cfile; do
          sed -i 's/static void VerifyMacroImpl/inline static void VerifyMacroImpl/g' "$cfile"
        done

        # 3. แก้ปัญหา Matrix.h และ audiostream.cpp
        find "$CPP_ROOT" -iname "Matrix.h" | while read -r matrix_file; do
          sed -i '1i class CQuaternion;' "$matrix_file"
        done

        find "$CPP_ROOT" -iname "audiostream.cpp" | while read -r audio_file; do
          sed -i 's/Log("Play: %s", szUrl);/\/\/ Log("Play: %s", szUrl);/g' "$audio_file"
          sed -i 's/Log("Stop: %s", g_szAudioStreamUrl);/\/\/ Log("Stop: %s", g_szAudioStreamUrl);/g' "$audio_file"
        done

        # 4. ลบไฟล์ Vector.h ที่ซ้ำซ้อนใน Collision เพื่อป้องกัน Ambiguous Error
        find "$CPP_ROOT" -path "*/Collision/Vector.h" -delete 2>/dev/null || true

        # 5. ตั้งค่า Include Directories ใน CMakeLists.txt ให้ครอบคลุมโดยไม่ก็อปปี้ไฟล์ซ้ำ
        find "$CPP_ROOT" -name "CMakeLists.txt" | while read -r cmake_file; do
          cmake_dir=$(dirname "$cmake_file")
          all_subdirs=$(find "$cmake_dir" -type d | tr '\n' ' ')
          sed -i "1i include_directories($all_subdirs)\nadd_compile_options(-w -fpermissive -fexceptions -Wno-everything)\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} -w -fpermissive -fexceptions -std=c++14 -Wno-everything\")\nset(CMAKE_C_FLAGS \"\${CMAKE_C_FLAGS} -w -fpermissive -Wno-everything\")" "$cmake_file"
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
