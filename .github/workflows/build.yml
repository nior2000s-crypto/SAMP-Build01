name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        else
          echo "No zip file found, skipping unzip."
        fi

    - name: Flatten Widget Headers & Case Fix
      run: |
        # ค้นหาโฟลเดอร์ samp_widgets แบบไม่สนตัวเล็กตัวใหญ่
        WIDGET_DIR=$(find . -iname "samp_widgets" -type d | head -n 1)
        if [ -n "$WIDGET_DIR" ]; then
          echo "Found widget directory at: $WIDGET_DIR"
          
          # คัดลอกไฟล์ทั้งหมดใน samp_widgets ไปวางไว้ตามโฟลเดอร์ gui และโฟลเดอร์ย่อย samp_widgets ทุกจุด
          find . -type d -name "gui" | while read -r gui_path; do
            mkdir -p "$gui_path/samp_widgets"
            cp -r "$WIDGET_DIR"/* "$gui_path/" 2>/dev/null || true
            cp -r "$WIDGET_DIR"/* "$gui_path/samp_widgets/" 2>/dev/null || true
          done
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
