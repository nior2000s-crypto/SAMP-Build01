name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Fix Header Paths and Directory Names
      run: |
        SAMP_DIR="app/src/main/cpp/samp"
        if [ -d "$SAMP_DIR" ]; then
          # ค้นหาโฟลเดอร์ samp_widgets ไม่ว่าจะอยู่จุดไหน แล้วคัดลอกไฟล์ข้างในมาวางกระจายไว้ใน gui และ samp
          find "$SAMP_DIR" -type d -iname "samp_widgets" | while read -r widget_dir; do
            cp -r "$widget_dir"/* "$SAMP_DIR/gui/" 2>/dev/null || true
            cp -r "$widget_dir"/* "$SAMP_DIR/" 2>/dev/null || true
            mkdir -p "$SAMP_DIR/samp_widgets"
            cp -r "$widget_dir"/* "$SAMP_DIR/samp_widgets/" 2>/dev/null || true
          done

          # สร้างโฟลเดอร์ dialogs สำรองดักไว้ด้วย
          find "$SAMP_DIR" -type d -iname "dialogs" | while read -r dialog_dir; do
            cp -r "$dialog_dir"/* "$SAMP_DIR/gui/" 2>/dev/null || true
            mkdir -p "$SAMP_DIR/dialogs"
            cp -r "$dialog_dir"/* "$SAMP_DIR/dialogs/" 2>/dev/null || true
          done
        fi

        # ฝัง include_directories เฉพาะใน CMakeLists.txt ของ samp เท่านั้น
        SAMP_CMAKE=$(find app/src/main/cpp/samp -maxdepth 1 -name "CMakeLists.txt" | head -n 1)
        if [ -n "$SAMP_CMAKE" ]; then
          sed -i '1i include_directories(${CMAKE_CURRENT_SOURCE_DIR} ${CMAKE_CURRENT_SOURCE_DIR}/gui ${CMAKE_CURRENT_SOURCE_DIR}/samp_widgets ${CMAKE_CURRENT_SOURCE_DIR}/dialogs)\nadd_compile_options(-w -fpermissive)' "$SAMP_CMAKE"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
