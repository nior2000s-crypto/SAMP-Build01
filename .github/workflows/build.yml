name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Fix Header Files & Include Directives
      run: |
        CPP_ROOT="app/src/main/cpp"

        # 1. ตัดคำว่า dialogs/ หรือ Dialogs/ ออกจากการเรียก include เพื่อให้อ่านไฟล์โดยตรง
        find "$CPP_ROOT" -type f \( -name "*.h" -o -name "*.cpp" \) | while read -r f; do
          sed -i 's/#include "dialogs\//#include "/g' "$f"
          sed -i 's/#include "Dialogs\//#include "/g' "$f"
        done

        # 2. คัดลอกไฟล์ .h ทุกไฟล์ในโปรเจกต์มาวางไว้ที่ Root C++ และทุกโฟลเดอร์ย่อย (รองรับทั้งชื่อพิมพ์เล็กและชื่อเดิม)
        find "$CPP_ROOT" -type f \( -name "*.h" -o -name "*.hpp" \) | while read -r hfile; do
          fname=$(basename "$hfile")
          lower_name=$(echo "$fname" | tr '[:upper:]' '[:lower:]')
          
          # วางลงโฟลเดอร์หลัก C++
          cp -n "$hfile" "$CPP_ROOT/$fname" 2>/dev/null || true
          cp -n "$hfile" "$CPP_ROOT/$lower_name" 2>/dev/null || true

          # วางลงโฟลเดอร์ที่มีไฟล์เรียกใช้
          find "$CPP_ROOT" -type d | while read -r target_dir; do
            cp -n "$hfile" "$target_dir/$fname" 2>/dev/null || true
            cp -n "$hfile" "$target_dir/$lower_name" 2>/dev/null || true
          done
        done

        # 3. แก้ปัญหา unknown type name 'CQuaternion' ใน Matrix.h
        find "$CPP_ROOT" -iname "Matrix.h" | while read -r matrix_file; do
          sed -i '1i class CQuaternion;' "$matrix_file"
        done

        # 4. แก้ปัญหา audiostream.cpp
        find "$CPP_ROOT" -iname "audiostream.cpp" | while read -r audio_file; do
          sed -i 's/Log("Play: %s", szUrl);/\/\/ Log("Play: %s", szUrl);/g' "$audio_file"
          sed -i 's/Log("Stop: %s", g_szAudioStreamUrl);/\/\/ Log("Stop: %s", g_szAudioStreamUrl);/g' "$audio_file"
        done

        # 5. เพิ่ม Include Path ทุกโฟลเดอร์ลงใน CMakeLists.txt
        CPP_DIRS=$(find "$CPP_ROOT" -type d | tr '\n' ' ')
        find "$CPP_ROOT" -name "CMakeLists.txt" | while read -r cmake_file; do
          sed -i "1i include_directories($CPP_DIRS)\nadd_compile_options(-w -fpermissive -Wno-error=everything)\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} -w -fpermissive\")" "$cmake_file"
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
