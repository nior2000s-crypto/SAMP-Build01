name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Force Copy All Headers to Include Paths
      run: |
        # หาตำแหน่งโฟลเดอร์ cpp หลัก
        CPP_DIR=$(find app/src/main/cpp -type d -name "samp" | head -n 1)
        if [ -z "$CPP_DIR" ]; then
          CPP_DIR="app/src/main/cpp"
        fi

        # ค้นหาไฟล์ .h ทั้งหมดในโปรเจกต์ แล้วคัดลอกไปไว้ใน gui และ samp โดยตรง
        mkdir -p "$CPP_DIR/gui"
        find app/src/main/cpp -type f -name "*.h" -exec cp {} "$CPP_DIR/gui/" \; 2>/dev/null || true
        find app/src/main/cpp -type f -name "*.h" -exec cp {} "$CPP_DIR/" \; 2>/dev/null || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug -Pandroid.disableAutomaticComponentCreation=true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
