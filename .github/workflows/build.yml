name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Fix All Dialogs & Case Sensitivity Issues
      run: |
        CPP_ROOT="app/src/main/cpp"

        # 1. จัดการโฟลเดอร์ dialogs / Dialogs ให้รองรับทุกรูปแบบตัวพิมพ์
        find "$CPP_ROOT" -type d -iname "dialogs" | while read -r dpath; do
          parent_dir=$(dirname "$dpath")
          mkdir -p "$parent_dir/dialogs" "$parent_dir/Dialogs"
          cp -rn "$dpath"/* "$parent_dir/dialogs/" 2>/dev/null || true
          cp -rn "$dpath"/* "$parent_dir/Dialogs/" 2>/dev/null || true
        done

        # 2. ค้นหาไฟล์ .h ทุกไฟล์ในโฟลเดอร์ C++ แล้วสร้างสำเนาทั้งชื่อพิมพ์เล็ก พิมพ์ใหญ่ และ camelCase
        find "$CPP_ROOT" -type f \( -name "*.h" -o -name "*.hpp" \) | while read -r hfile; do
          dir=$(dirname "$hfile")
          fname=$(basename "$hfile")
          lower_name=$(echo "$fname" | tr '[:upper:]' '[:lower:]')
          
          # คัดลอกไฟล์สร้างชื่อพิมพ์เล็กตระเตรียมไว้ในโฟลเดอร์เดียวกัน
          if [ "$fname" != "$lower_name" ]; then
            cp -n "$hfile" "$dir/$lower_name" 2>/dev/null || true
          fi
        done

        # 3. แก้ปัญหา playerTabList.h ดักไว้ทุกจุด
        TABLIST_FILE=$(find "$CPP_ROOT" -iname "playertablist.h" | head -n 1)
        if [ -n "$TABLIST_FILE" ]; then
          find "$CPP_ROOT" -type d | while read -r dir; do
            cp -n "$TABLIST_FILE" "$dir/playerTabList.h" 2>/dev/null || true
          done
        fi

        # 4. แก้ปัญหา unknown type name 'CQuaternion' ใน Matrix.h
        find "$CPP_ROOT" -iname "Matrix.h" | while read -r matrix_file; do
          sed -i '1i class CQuaternion;' "$matrix_file"
        done

        # 5. แก้ปัญหา audiostream.cpp
        find "$CPP_ROOT" -iname "audiostream.cpp" | while read -r audio_file; do
          sed -i 's/Log("Play: %s", szUrl);/\/\/ Log("Play: %s", szUrl);/g' "$audio_file"
          sed -i 's/Log("Stop: %s", g_szAudioStreamUrl);/\/\/ Log("Stop: %s", g_szAudioStreamUrl);/g' "$audio_file"
        done

        # 6. เพิ่ม Include Path ทั้งหมดลงใน CMakeLists.txt
        CPP_DIRS=$(find "$CPP_ROOT" -type d | tr '\n' ' ')
        find "$CPP_ROOT" -name "CMakeLists.txt" | while read -r cmake_file; do
          sed -i "1i include_directories($CPP_DIRS)\nadd_compile_options(-w -fpermissive -Wno-error=everything)\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} -w -fpermissive\")" "$cmake_file"
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
