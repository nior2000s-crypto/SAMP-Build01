name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Global Search & Inject Header Files
      run: |
        # ค้นหาไฟล์ playerTabList.h จากทุกซอกทุกมุมของ repository (ไม่จำกัดเฉพาะโฟลเดอร์ samp)
        TABLIST_PATH=$(find . -iname "*playertablist*.h" | head -n 1)
        
        if [ -n "$TABLIST_PATH" ]; then
          echo "Found TabList Header at: $TABLIST_PATH"
          # สำเนาไฟล์นี้ไปไว้ข้างๆ gui.h ทุกจุดที่มี gui.h อยู่
          find . -name "gui.h" | while read -r gui_file; do
            gui_dir=$(dirname "$gui_file")
            echo "Copying playerTabList.h to $gui_dir"
            cp "$TABLIST_PATH" "$gui_dir/playerTabList.h" 2>/dev/null || true
            cp "$TABLIST_PATH" "$gui_dir/PlayerTabList.h" 2>/dev/null || true
          done
        fi

        # ดึงไฟล์ .h ทั้งหมดจากทุกโฟลเดอร์ย่อย เทรวมเข้าไปในโฟลเดอร์ gui เพื่อป้องกันการหาไฟล์ไม่เจอ
        find . -type d -name "gui" | while read -r gui_dir; do
          find . -type f -name "*.h" -exec cp {} "$gui_dir/" \; 2>/dev/null || true
        done

    - name: Configure CMake Flags
      run: |
        # บังคับเพิ่ม Include Directories ให้ CMake สแกนหาไฟล์ .h จากทุกโฟลเดอร์ย่อยใน app/src/main/cpp
        CPP_DIRS=$(find app/src/main/cpp -type d 2>/dev/null | tr '\n' ' ')
        find . -name "CMakeLists.txt" -exec sed -i "1i include_directories($CPP_DIRS)\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} -w -fpermissive\")" {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
