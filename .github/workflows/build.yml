name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Fix C++ Headers & Audiostream Error
      run: |
        # 1. แทรก Forward Declaration ใน Matrix.h
        find app/src/main/cpp -iname "Matrix.h" | while read -r matrix_file; do
          sed -i '1i class CQuaternion;' "$matrix_file"
        done

        # 2. สร้าง Symlink สำหรับไฟล์ .h ทั้งหมด
        CPP_ROOT="app/src/main/cpp"
        TARGET_SAMP="$CPP_ROOT/samp"
        TARGET_GUI="$CPP_ROOT/samp/gui"
        
        mkdir -p "$TARGET_SAMP" "$TARGET_GUI"
        
        find "$CPP_ROOT" -type f \( -name "*.h" -o -name "*.hpp" \) | while read -r hfile; do
          fname=$(basename "$hfile")
          ln -sfn "$(realpath "$hfile")" "$TARGET_SAMP/$fname" 2>/dev/null || true
          ln -sfn "$(realpath "$hfile")" "$TARGET_GUI/$fname" 2>/dev/null || true
        done

        # 3. แก้ไขข้อผิดพลาดใน audiostream.cpp (คอมเมนต์บรรทัด Log ที่ส่งผลให้เกิด struct initializer error)
        find app/src/main/cpp -iname "audiostream.cpp" | while read -r audio_file; do
          sed -i 's/Log("Play: %s", szUrl);/\/\/ Log("Play: %s", szUrl);/g' "$audio_file"
          sed -i 's/Log("Stop: %s", g_szAudioStreamUrl);/\/\/ Log("Stop: %s", g_szAudioStreamUrl);/g' "$audio_file"
        done

        # 4. ตั้งค่า Flag ผ่อนปรนเพิ่มเติมสำหรับ Clang C++
        find app/src/main/cpp -name "CMakeLists.txt" | while read -r cmake_file; do
          sed -i '1i add_compile_options(-w -fpermissive -Wno-error=everything -Wno-c++11-narrowing -Wno-excess-initializers)\nset(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -w -fpermissive")' "$cmake_file"
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
