name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Fix Case Sensitivity & Link All Headers
      run: |
        CPP_ROOT="app/src/main/cpp"
        if [ -d "$CPP_ROOT" ]; then
          find "$CPP_ROOT" -type f \( -name "*.h" -o -name "*.hpp" \) | while read -r hfile; do
            filename=$(basename "$hfile")
            lower_filename=$(echo "$filename" | tr '[:upper:]' '[:lower:]')
            
            find "$CPP_ROOT" -type d \( -name "samp" -o -name "gui" -o -name "dialogs" \) | while read -r target_dir; do
              cp -u "$hfile" "$target_dir/$filename" 2>/dev/null || true
              cp -u "$hfile" "$target_dir/$lower_filename" 2>/dev/null || true
            done
          done
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
