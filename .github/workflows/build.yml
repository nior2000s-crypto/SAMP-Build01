name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Inject Global Include Paths into CMake
      run: |
        # ดึงพาธของโฟลเดอร์ย่อยทั้งหมดใต้ app/src/main/cpp แบบครอบจักรวาล
        ALL_CPP_DIRS=$(find app/src/main/cpp -type d 2>/dev/null | tr '\n' ' ')
        
        # แก้ไข CMakeLists.txt ในโฟลเดอร์ samp ให้มองเห็นทุกโฟลเดอร์โดยไม่ต้องก็อปปี้ไฟล์
        SAMP_CMAKE=$(find app/src/main/cpp/samp -maxdepth 1 -name "CMakeLists.txt" | head -n 1)
        if [ -n "$SAMP_CMAKE" ]; then
          sed -i "1i include_directories($ALL_CPP_DIRS)\nadd_compile_options(-w -fpermissive)" "$SAMP_CMAKE"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
