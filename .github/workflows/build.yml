name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Clean Duplicates & Create Soft Links
      run: |
        SAMP_DIR="app/src/main/cpp/samp"
        
        # 1. ลบโฟลเดอร์ dialogs ที่ก๊อปปี้ซ้ำออก ป้องกัน Redefinition Error
        rm -rf "$SAMP_DIR/dialogs" 2>/dev/null || true
        
        # 2. ทำ Symlink เชื่อม samp/dialogs ไปหา samp_widgets/dialogs โดยตรง ไม่ก็อปปี้ไฟล์ซ้ำ
        REAL_DIALOGS=$(find "$SAMP_DIR" -type d -name "dialogs" | head -n 1)
        if [ -n "$REAL_DIALOGS" ]; then
          mkdir -p "$SAMP_DIR"
          ln -sfn "$(realpath "$REAL_DIALOGS")" "$SAMP_DIR/dialogs"
        fi

    - name: Configure CMake Include Paths
      run: |
        # ตั้งค่า include_directories แบบสะอาด ปราศจากไฟล์ซ้ำ
        SAMP_CMAKE=$(find app/src/main/cpp/samp -maxdepth 1 -name "CMakeLists.txt" | head -n 1)
        if [ -n "$SAMP_CMAKE" ]; then
          sed -i '1i include_directories(${CMAKE_CURRENT_SOURCE_DIR} ${CMAKE_CURRENT_SOURCE_DIR}/gui ${CMAKE_CURRENT_SOURCE_DIR}/samp_widgets ${CMAKE_CURRENT_SOURCE_DIR}/samp_widgets/dialogs)\nadd_compile_options(-w -fpermissive)' "$SAMP_CMAKE"
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
