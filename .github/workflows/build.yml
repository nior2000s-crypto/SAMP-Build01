name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Universal Header & Dialogs Fixer
      run: |
        # 1. ค้นหาไฟล์ playerTabList.h แล้ววางไว้ใน gui ทุกจุด
        TABLIST_PATH=$(find . -iname "*playertablist*.h" | head -n 1)
        if [ -n "$TABLIST_PATH" ]; then
          find . -name "gui.h" | while read -r gui_file; do
            gui_dir=$(dirname "$gui_file")
            cp "$TABLIST_PATH" "$gui_dir/playerTabList.h" 2>/dev/null || true
          done
        fi

        # 2. ค้นหาไฟล์ tablistwidget.h หรือ widget อื่นๆ แล้วสร้างโฟลเดอร์ dialogs รองรับ
        WIDGET_PATH=$(find . -iname "*tablistwidget*.h" | head -n 1)
        if [ -n "$WIDGET_PATH" ]; then
          widget_parent=$(dirname "$WIDGET_PATH")
          echo "Found widget at $WIDGET_PATH"
          
          # สร้างโฟลเดอร์ dialogs ไว้ข้างๆ gui และในทุกจุดที่มี gui
          find . -name "gui" -type d | while read -r g_dir; do
            parent_d=$(dirname "$g_dir")
            mkdir -p "$parent_d/dialogs"
            cp "$widget_parent"/*.h "$parent_d/dialogs/" 2>/dev/null || true
            cp "$widget_parent"/*.h "$g_dir/" 2>/dev/null || true
          done
        fi

        # 3. เทไฟล์ .h ทั้งหมดมารวมกันในทุกโฟลเดอร์ dialogs และ samp เพื่อความปลอดภัยสูงสุด
        find . -type d -name "dialogs" | while read -r d_dir; do
          find . -type f -name "*.h" -exec cp {} "$d_dir/" \; 2>/dev/null || true
        done

    - name: Configure CMake Include Paths
      run: |
        CPP_DIRS=$(find app/src/main/cpp -type d 2>/dev/null | tr '\n' ' ')
        find . -name "CMakeLists.txt" -exec sed -i "1i include_directories($CPP_DIRS)\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} -w -fpermissive\")" {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
