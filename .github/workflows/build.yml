name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Unzipping $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_unzip
          GRADLEW_PATH=$(find temp_unzip -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cp -r "$PROJECT_DIR"/* .
          fi
          rm -rf temp_unzip
        fi

    - name: Auto-Discover and Fix SAMP Header Directories
      run: |
        CPP_ROOT="app/src/main/cpp"
        if [ -d "$CPP_ROOT" ]; then
          # คัดลอกเฉพาะ header files ที่อยู่ในโฟลเดอร์ samp
          find "$CPP_ROOT/samp" -type f \( -name "*.h" -o -name "*.hpp" \) 2>/dev/null | while read -r header_file; do
            dir_path=$(dirname "$header_file")
            folder_name=$(basename "$dir_path")
            
            mkdir -p "$CPP_ROOT/samp/$folder_name"
            cp "$header_file" "$CPP_ROOT/samp/$folder_name/" 2>/dev/null || true
            cp "$header_file" "$CPP_ROOT/samp/" 2>/dev/null || true
          done
        fi

    - name: Inject Target-Specific CMake Settings
      run: |
        # ดึงรวมไดเรกทอรีเฉพาะใต้โฟลเดอร์ samp เท่านั้น ไม่รวม opus
        SAMP_DIRS=$(find app/src/main/cpp/samp -type d 2>/dev/null | tr '\n' ' ')
        
        # ค้นหา CMakeLists.txt ที่อยู่ในส่วนของ samp เท่านั้น แล้วฉีด include_directories
        find app/src/main/cpp/samp -name "CMakeLists.txt" -exec sed -i "1i include_directories($SAMP_DIRS)\nset(CMAKE_CXX_FLAGS \"\${CMAKE_CXX_FLAGS} -w -fpermissive\")" {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
